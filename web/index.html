<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="trip_io">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>trip_io</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by maplibre_gl_web (the Map screen's Android/Web renderer) -
       version must match the installed maplibre_gl_web package. -->
  <script src='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css' rel='stylesheet'/>

  <style>
    /* Covers the plain white page Flutter would otherwise show while the
       engine/assets load - painted immediately from index.html itself, not
       from anything Flutter renders, so it's there from the very first
       frame. Colors match the app's own theme seed (#0A7E8C, see
       lib/themes/theme.dart) and the marketing site's dark background, so
       there's no jarring color swap once the real app takes over. Removed
       by web/flutter_bootstrap.js once Flutter has actually started - see
       there for the fade-out trigger. */
    html, body {
      background: #07131a;
      margin: 0;
      height: 100%;
    }

    #trip-io-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #0d2a4a 0%, #07131a 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #trip-io-splash.trip-io-splash-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .trip-io-splash-glow {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trip-io-splash-glow::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 196, 0.45) 0%, rgba(20, 184, 196, 0) 70%);
      animation: trip-io-pulse 2.2s ease-in-out infinite;
    }

    .trip-io-splash-glow img {
      width: 96px;
      height: 96px;
      position: relative;
      animation: trip-io-breathe 2.2s ease-in-out infinite;
    }

    .trip-io-splash-wordmark {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .trip-io-splash-wordmark .trip { color: #ffffff; }
    .trip-io-splash-wordmark .io { color: #14b8c4; }

    .trip-io-splash-dots {
      display: flex;
      gap: 7px;
    }

    .trip-io-splash-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #14b8c4;
      animation: trip-io-dot 1.2s ease-in-out infinite;
    }

    .trip-io-splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    .trip-io-splash-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes trip-io-pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes trip-io-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes trip-io-dot {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .trip-io-splash-glow::before,
      .trip-io-splash-glow img,
      .trip-io-splash-dots span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="trip-io-splash">
    <div class="trip-io-splash-glow">
      <img src="icons/Icon-512.png" alt="" />
    </div>
    <div class="trip-io-splash-wordmark"><span class="trip">trip</span><span class="io">_io</span></div>
    <div class="trip-io-splash-dots"><span></span><span></span><span></span></div>
  </div>

  <!--
    Customized in web/flutter_bootstrap.js, which removes #trip-io-splash
    above once Flutter has actually started rendering - see the comment
    there for why a custom bootstrap script was needed for that at all.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
