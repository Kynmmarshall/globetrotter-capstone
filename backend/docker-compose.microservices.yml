# Phase 2 microservices stack - a separate deployment target from the
# Phase 1 monolith's docker-compose.yml, not a replacement for it. The
# monolith (app/) is untouched and can keep running independently on its
# own systemd service until this stack is verified end-to-end.
#
# Usage:
#   docker compose -f docker-compose.microservices.yml up --build
#   Gateway (single public entry point): http://localhost:8000
#
# Third-party API keys are optional at every service that reads them (same
# "not configured" degrade-gracefully behavior as the monolith) - set them
# via a local .env file (not committed) or your shell environment before
# `docker compose up`.

x-shared-env: &shared-env
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

services:
  rabbitmq:
    image: rabbitmq:3-management
    # No ports: published to the host - only the three app services talk to
    # this, over the Docker network's own DNS (amqp://guest:guest@rabbitmq:5672/).
    # Publishing 5672/15672 would put the default guest/guest credentials
    # directly on the internet on a public VPS. To browse the management UI
    # locally, use an SSH tunnel instead:
    #   ssh -L 15672:localhost:15672 <vps-user>@<vps-host>
    # then add back "127.0.0.1:15672:15672" (host-only) if you want it to
    # persist rather than re-tunneling each time.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user_service:
    build: ./services/user_service
    environment:
      <<: *shared-env
      USER_SERVICE_DATA_PATH: /srv/data/users.json
      RECOMMENDATION_SERVICE_URL: http://recommendation_service:8003
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    volumes:
      - ./services/user_service/data:/srv/data
      - ./services/user_service/static:/srv/static
    # No host port published - only the Gateway and recommendation_service
    # talk to this, over the Docker network. Add back "8001:8001" locally
    # if you want to curl it directly while debugging.
    depends_on:
      rabbitmq:
        condition: service_healthy

  itinerary_service:
    build: ./services/itinerary_service
    environment:
      <<: *shared-env
      ITINERARY_SERVICE_DATA_PATH: /srv/data/itineraries.json
    volumes:
      - ./services/itinerary_service/data:/srv/data
    # No host port published - only the Gateway and recommendation_service
    # talk to this, over the Docker network. Add back "8002:8002" locally
    # if you want to curl it directly while debugging.
    depends_on:
      rabbitmq:
        condition: service_healthy

  recommendation_service:
    build: ./services/recommendation_service
    environment:
      <<: *shared-env
      RECOMMENDATION_SERVICE_DATA_PATH: /srv/data/destinations.json
      USER_SERVICE_URL: http://user_service:8001
      ITINERARY_SERVICE_URL: http://itinerary_service:8002
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ORS_API_KEY: ${ORS_API_KEY:-}
    volumes:
      - ./services/recommendation_service/data:/srv/data
      - ./services/recommendation_service/static:/srv/static
    # No host port published - only the Gateway talks to this, over the
    # Docker network. Add back "8003:8003" locally if you want to curl it
    # directly while debugging.
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      USER_SERVICE_URL: http://user_service:8001
      ITINERARY_SERVICE_URL: http://itinerary_service:8002
      RECOMMENDATION_SERVICE_URL: http://recommendation_service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      WEBSITE_DIR: /website
      MATOMO_URL: ${MATOMO_URL:-https://trip-io-analytics.duckdns.org}
      MATOMO_API_TOKEN: ${MATOMO_API_TOKEN:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-1}
    volumes:
      - ./website:/website
    ports:
      - "8000:8000"
    depends_on:
      - user_service
      - itinerary_service
      - recommendation_service
